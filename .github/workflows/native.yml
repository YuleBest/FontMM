name: Native (Zygisk / Subset)

on:
  push:
    paths:
      - 'native/**'
      - 'dev/build-zygisk.mjs'
      - 'dev/build-subset.mjs'
      - 'dev/lib/ndk.mjs'
      - 'dev/lib/harfbuzz.mjs'
  pull_request:
    paths:
      - 'native/**'
      - 'dev/build-zygisk.mjs'
      - 'dev/build-subset.mjs'
      - 'dev/lib/ndk.mjs'
      - 'dev/lib/harfbuzz.mjs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 固定 NDK 版本, 保证 CI 与开发者本地编译出的二进制一致 (至少工具链同版本)。
      # 必须显式把 ndk-path 传给构建脚本: setup-ndk 不会自动设置 ANDROID_NDK_HOME,
      # 否则 dev/lib/ndk.mjs 会回退到 runner 预装的其它 NDK 版本 (实测踩过:
      # 声明 r27c 却用了预装的 r27d)
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # harfbuzz 的编译约需 88 秒 (占 fontmm-subset 构建的绝大部分), 故缓存其
      # 源码与编译产物。缓存键含 harfbuzz 版本与 NDK 版本 —— 二者任一变化即
      # 不命中, 不会用到与当前工具链不匹配的对象文件。
      - name: Cache harfbuzz
        uses: actions/cache@v4
        with:
          path: |
            dev/.cache/harfbuzz
            dev/.cache/harfbuzz-obj
          key: harfbuzz-${{ runner.os }}-${{ hashFiles('dev/lib/harfbuzz.mjs') }}

      # 构建脚本自身会校验导出符号与动态依赖 (不得依赖 libc++_shared 等
      # 不在 Zygisk 加载器搜索路径中的库), 校验失败即退出非 0
      - name: Build Zygisk module (arm64-v8a)
        run: node dev/build-zygisk.mjs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build subset tool (arm64)
        run: node dev/build-subset.mjs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fontmm-native
          path: |
            src/zygisk/arm64-v8a.so
            src/tools/fontmm-subset
          retention-days: 14
