name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Zygisk 模块 (C++) 需要 NDK 交叉编译; 该 action 会设置 ANDROID_NDK_HOME,
      # dev/lib/ndk.mjs 据此定位工具链
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # 根依赖提供打包所需的 zip 库 (@zip.js/zip.js),
      # 打包脚本不再依赖 zip / unzip 命令, 故无需系统级安装
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebUI dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Build WebUI
        run: pnpm -C web build

      # 打包内部会编译 fontmm-wght (Go) 与 Zygisk 模块 (C++),
      # 并生成两版产物与 .sha256 校验文件
      # 注意: 必须写 `pnpm run pack`, 不可省略 run —— `pnpm pack` 是 pnpm 内置的
      # 打包命令 (生成 npm tarball), 会与我们定义的 pack 脚本冲突
      # --no-cache: CI 是一次性构建, 预压缩缓存没有收益, 也避免引入
      # 与构建机相关的状态 (缓存目录不入库, 本地开发时才生效)
      - name: Pack module (preplace / template)
        run: pnpm run pack -- --no-cache

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
