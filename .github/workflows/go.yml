name: Go

on:
  push:
    paths:
      - 'golang/**'
      - 'dev/build-wght.mjs'
      - 'dev/lib/go.mjs'
  pull_request:
    paths:
      - 'golang/**'
      - 'dev/build-wght.mjs'
      - 'dev/lib/go.mjs'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 声明的工具链版本, 避免宽泛的 '1.24' 解析到最新补丁版
          # (CI 曾装 1.24.13 而本地是 1.24.4, 编译产物因此不同)
          go-version-file: golang/go.mod

      - name: Vet
        run: cd golang && go vet ./...

      - name: Test
        run: cd golang && go test ./...

      # 用与本地一致的构建脚本 (含 -trimpath -buildvcs=false), 保证 CI 产物
      # 与开发者本地构建的二进制哈希一致
      - name: Cross-compile (android/arm64)
        run: node dev/build-wght.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fontmm-wght
          path: src/tools/fontmm-wght
