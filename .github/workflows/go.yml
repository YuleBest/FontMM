name: Go

on:
  push:
    paths:
      - 'golang/**'
      - 'dev/build-wght.sh'
  pull_request:
    paths:
      - 'golang/**'
      - 'dev/build-wght.sh'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: cd golang && go vet ./...

      - name: Test
        run: cd golang && go test ./...

      - name: Cross-compile (android/arm64)
        run: cd golang && GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/fontmm-wght ./cmd/fontmm-wght

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fontmm-wght
          path: /tmp/fontmm-wght
