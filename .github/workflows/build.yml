name: Build & Upload Artifacts

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 声明的工具链版本, 避免宽泛的 '1.24' 解析到最新补丁版
          # (CI 曾装 1.24.13 而本地是 1.24.4, 编译产物因此不同)
          go-version-file: golang/go.mod

      # Zygisk 模块 (C++) 需要 NDK 交叉编译。
      # 注意: setup-ndk 只下载并暴露路径, 不会自动设置 ANDROID_NDK_HOME,
      # 必须由使用方显式传入, 否则 dev/lib/ndk.mjs 会回退到 runner 预装的
      # 其它 NDK 版本 (实测踩过: 声明 r27c 却用了预装的 r27d)
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # 根依赖提供打包所需的 zip 库 (@zip.js/zip.js),
      # 打包脚本不再依赖 zip / unzip 命令, 故无需系统级安装
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebUI dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Build WebUI
        run: pnpm -C web build

      # 打包内部会编译 fontmm-wght (Go) 与 Zygisk 模块 (C++),
      # 并生成两版产物与 .sha256 校验文件
      # 注意: 必须写 `pnpm run pack`, 不可省略 run —— `pnpm pack` 是 pnpm 内置的
      # 打包命令 (生成 npm tarball), 会与我们定义的 pack 脚本冲突
      # --no-cache: CI 是一次性构建, 预压缩缓存没有收益, 也避免引入
      # 与构建机相关的状态 (缓存目录不入库, 本地开发时才生效)
      - name: Pack module (preplace / template)
        run: pnpm run pack -- --no-cache
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fontmm-build
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 14
